spring.application.name=rtm-booking-reservation
server.port=${APP_BOOKING_RESERVATION_PORT:3003}

# Carga las variables del archivo .env (solo en local)
spring.config.import=optional:file:.env[.properties]

# Base compartida rentamovil, con el usuario booking_app (nunca sa)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Las tablas las crea rtm-booking-reservation-db (Liquibase). Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=booking
# Las fechas se leen y escriben en UTC (ver BookingReservationApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Seguridad: solo la clave PÚBLICA de iam (la privada nunca sale de rtm-iam)
app.booking-reservation.jwt.public-key=${APP_BOOKING_RESERVATION_JWT_PUBLIC_KEY:}

# fleet-maintenance: precio y disponibilidad del vehículo, y destino de RentalStarted/RentalCompleted
app.booking-reservation.fleet-url=${FLEET_URL:http://localhost:3002}
app.booking-reservation.fleet-timeout=${FLEET_TIMEOUT:3s}

# INV-015: horas que una reserva espera un pago aprobado antes de expirar a CANCELLED
app.booking-reservation.reservation.payment-window-hours=${APP_BOOKING_RESERVATION_PAYMENT_WINDOW_HOURS:24}